services:
  backend:
    build:
      context: ./backend
    environment:
      # Must point to the PostgreSQL instance managed by aios-infra. When the
      # backend itself runs in Docker, use an address reachable from Docker
      # instead of 127.0.0.1 (for example host.docker.internal on macOS).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to aios-infra PostgreSQL}
      MILVUS_URI: ${MILVUS_URI:-http://192.168.100.100:19530}
      AI_DEBUG: "true"
    ports:
      - "24435:24435"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:24435/health', timeout=3).read()\""]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "24434:24434"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:24434 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
